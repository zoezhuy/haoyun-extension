<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haoyun Autofill Synthetic Test Page</title>
    <style>
      body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; color: #1f2937; }
      form { display: grid; gap: 16px; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input, select, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      .notice { padding: 12px 16px; background: #eef2ff; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Haoyun 合成自动填写测试页</h1>
    <p class="notice">仅使用虚构字段测试文本框、原生下拉框和中英文标签识别；此页面不会提交或传输数据。</p>
    <form action="#" onsubmit="event.preventDefault()">
      <label>姓名 <input name="full_name" autocomplete="name" /></label>
      <label>Email <input name="email" type="email" autocomplete="email" /></label>
      <label>手机号 <input name="mobile_phone" type="tel" /></label>
      <label>毕业院校 <input name="school" /></label>
      <label>Major / 专业 <input name="major" /></label>
      <label>最高学历
        <select name="degree">
          <option value="">请选择</option>
          <option>Master</option>
          <option>Bachelor</option>
          <option>Doctorate</option>
        </select>
      </label>
      <label>Graduation Year <input name="graduation_year" type="text" inputmode="numeric" /></label>
      <label>应聘职位 <input name="target_position" /></label>
      <label>意向城市 <input name="preferred_city" /></label>
      <label>Portfolio Website <input name="portfolio_website" type="url" /></label>
      <label>个人总结 <textarea name="personal_summary" rows="5"></textarea></label>
      <button type="submit">测试提交按钮（已禁用真实提交）</button>
    </form>
  </body>
</html>
